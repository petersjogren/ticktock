<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TickTock — Mechanical Word Clock</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --wall: #cbb79a;
      --wall-deep: #9d8566;
      --wood: #3a2416;
      --wood-mid: #5a3824;
      --wood-lit: #7a5336;
      --brass: #c4a36a;
      --brass-lit: #e6d09a;
      --brass-dim: #8a6b3a;
      --flap: #14110e;
      --flap-lit: #1e1a16;
      --ink: #f3ead6;
      --ink-dim: #8a8170;
      --gap: 8px;
      --flip: 340ms;
      --h: 88px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      min-height: 100%;
      background: var(--wall);
      color: var(--ink);
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      font-family: "Cormorant Garamond", Georgia, serif;
      background:
        radial-gradient(ellipse 80% 70% at 50% 42%, #e2d2b4 0%, #c4ad8a 48%, #8f7354 100%);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.18;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
      mix-blend-mode: multiply;
    }

    .scene {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      transform: scale(min(1, (100vw - 40px) / 920, (100vh - 40px) / 560));
      transform-origin: center center;
    }

    /* hanging hardware — ring + two cords */
    .hanger {
      position: relative;
      width: 220px;
      height: 78px;
      cursor: pointer;
      z-index: 2;
    }
    .hanger .ring {
      position: absolute;
      top: 0; left: 50%;
      width: 22px; height: 22px;
      transform: translateX(-50%);
      border-radius: 50%;
      border: 3px solid var(--brass);
      background: radial-gradient(circle at 35% 30%, #e8d5a0, #9a743e 70%);
      box-shadow:
        0 1px 0 var(--brass-lit),
        0 8px 14px rgba(0,0,0,.28);
      z-index: 3;
    }
    .hanger .cord {
      position: absolute;
      top: 14px;
      width: 7px;
      height: 68px;
      background:
        linear-gradient(90deg, #4a2c18 0%, #8a5a32 40%, #c48a54 50%, #8a5a32 60%, #4a2c18 100%);
      border-radius: 2px;
      transform-origin: top center;
      box-shadow: inset 1px 0 1px rgba(0,0,0,.35);
    }
    .hanger .cord.l { left: 50%; transform: translateX(-3px) rotate(22deg); }
    .hanger .cord.r { left: 50%; transform: translateX(-3px) rotate(-22deg); }

    .plaque {
      position: relative;
      width: max-content;
      max-width: 96vw;
      margin-top: -14px;
      padding: 26px 28px 18px;
      background:
        linear-gradient(90deg, #2a1810, #4a2e1c 8%, #3a2416 50%, #4a2e1c 92%, #2a1810);
      border-radius: 5px;
      box-shadow:
        0 42px 80px rgba(40, 20, 8, .48),
        0 14px 28px rgba(40, 20, 8, .32),
        inset 0 1px 0 rgba(255, 210, 150, .16),
        inset 0 -8px 16px rgba(0,0,0,.35);
    }

    .plaque::before {
      /* inner brass bezel */
      content: "";
      position: absolute;
      inset: 14px;
      border: 2px solid var(--brass-dim);
      border-radius: 3px;
      box-shadow:
        0 0 0 1px var(--brass-lit),
        inset 0 0 0 1px rgba(0,0,0,.4);
      pointer-events: none;
    }

    .screw {
      position: absolute;
      width: 12px; height: 12px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, var(--brass-lit), var(--brass) 40%, var(--brass-dim));
      box-shadow: 0 1px 2px rgba(0,0,0,.5), inset 0 -1px 1px rgba(0,0,0,.3);
      z-index: 3;
    }
    .screw::after {
      content: "";
      position: absolute;
      inset: 4px 2px;
      background: rgba(60,40,10,.55);
      transform: rotate(28deg);
    }
    .screw.tl { top: 18px; left: 18px; }
    .screw.tr { top: 18px; right: 18px; }
    .screw.bl { bottom: 18px; left: 18px; }
    .screw.br { bottom: 18px; right: 18px; }

    .board {
      background:
        linear-gradient(180deg, #1a1612 0%, #0e0c0a 100%);
      border-radius: 2px;
      padding: 22px 20px 18px;
      box-shadow: inset 0 8px 18px rgba(0,0,0,.55);
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 764px;
    }

    .row {
      display: flex;
      gap: var(--gap);
      align-items: stretch;
      justify-content: center;
    }

    .mod {
      position: relative;
      width: var(--w, 118px);
      height: var(--h);
      perspective: 640px;
      flex: 0 0 auto;
      transition: width 280ms ease, margin 280ms ease, opacity 220ms ease;
    }
    .mod.blank {
      width: 0 !important;
      margin-right: calc(var(--gap) * -1);
      opacity: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .mod[data-key="seconds"] { --w: 92px; }
    .mod[data-key="it"],
    .mod[data-key="is"] { --w: 64px; }
    .mod[data-key="special"] { --w: 148px; }
    .mod[data-key="tens"] { --w: 128px; }
    .mod[data-key="units"] { --w: 128px; }
    .mod[data-key="teen"] { --w: 92px; }
    .mod[data-key="min_word"] { --w: 148px; }
    .mod[data-key="relation"] { --w: 92px; }
    .mod[data-key="hour"] { --w: 128px; }
    .mod[data-key="oclock"] { --w: 148px; }

    .card {
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      font-family: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", sans-serif;
      font-weight: 600;
      font-size: 32px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--ink);
    }

    .half, .anim {
      position: absolute;
      left: 0; right: 0;
      height: 50%;
      overflow: hidden;
    }
    .half {
      background:
        linear-gradient(180deg, #2c2620 0%, #161310 100%);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.045);
    }
    .half.top { top: 0; border-radius: 4px 4px 0 0; }
    .half.bot { bottom: 0; border-radius: 0 0 4px 4px; }

    .half span, .anim span {
      position: absolute;
      left: 0; right: 0;
      height: var(--h);
      line-height: var(--h);
      text-align: center;
      white-space: nowrap;
      padding-left: 0.08em;
    }
    .half.top span, .anim.top span { top: 0; }
    .half.bot span, .anim.bot span { bottom: 0; }

    .mod.blank .card { color: transparent; }
    .mod.blank .half {
      background: linear-gradient(180deg, #181410 0%, #0c0b09 100%);
    }

    .hinge {
      position: absolute;
      left: 3px; right: 3px;
      top: 50%;
      height: 2px;
      margin-top: -1px;
      background: #000;
      box-shadow: 0 1px 0 rgba(255,255,255,.07);
      z-index: 5;
      pointer-events: none;
    }

    .anim {
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      z-index: 4;
      display: none;
    }
    .anim.top {
      top: 0;
      border-radius: 4px 4px 0 0;
      transform-origin: bottom center;
      background: linear-gradient(180deg, #2c2620 0%, #161310 100%);
    }
    .anim.bot {
      bottom: 0;
      border-radius: 0 0 4px 4px;
      transform-origin: top center;
      background: linear-gradient(180deg, #1a1612 0%, #100e0c 100%);
      transform: rotateX(90deg);
    }

    .mod.go .anim { display: block; }
    .mod.go .anim.top { animation: dropTop var(--flip) ease-in forwards; }
    .mod.go .anim.bot { animation: dropBot var(--flip) ease-out var(--flip) forwards; }

    @keyframes dropTop {
      from { transform: rotateX(0deg); }
      to   { transform: rotateX(-90deg); }
    }
    @keyframes dropBot {
      from { transform: rotateX(90deg); }
      to   { transform: rotateX(0deg); }
    }

    .mark {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-top: 14px;
      padding: 0 8px;
      color: var(--brass);
      letter-spacing: 0.42em;
      font-size: 13px;
      text-transform: uppercase;
      opacity: 0.85;
    }
    .mark em {
      font-style: italic;
      letter-spacing: 0.18em;
      opacity: 0.7;
    }
    .mark .hint {
      letter-spacing: 0.16em;
      font-size: 11px;
      opacity: 0.55;
      font-family: "Barlow Condensed", sans-serif;
    }

    .caption {
      margin-top: 18px;
      color: #6a5340;
      font-size: 15px;
      letter-spacing: 0.08em;
      text-align: center;
    }
    .caption strong {
      color: #4a3828;
      font-weight: 600;
    }

    @media (prefers-reduced-motion: reduce) {
      .mod.go .anim { display: none; }
    }
  </style>
</head>
<body>
  <div class="scene">
    <div class="hanger" id="strap" title="Click to wind a demo hour">
      <span class="ring"></span>
      <span class="cord l"></span>
      <span class="cord r"></span>
    </div>
    <div class="plaque" id="plaque">
      <span class="screw tl"></span>
      <span class="screw tr"></span>
      <span class="screw bl"></span>
      <span class="screw br"></span>
      <div class="board" id="board">
        <div class="row" id="row1"></div>
        <div class="row" id="row2"></div>
      </div>
      <div class="mark">
        <span>TickTock</span>
        <span class="hint" id="modeHint">live · click strap to wind</span>
        <span><em>Stockholm</em></span>
      </div>
    </div>
    <p class="caption" id="sentence"></p>
  </div>

  <script>
    (function () {
      const HOUR_WORDS = [
        "TWELVE","ONE","TWO","THREE","FOUR","FIVE",
        "SIX","SEVEN","EIGHT","NINE","TEN","ELEVEN"
      ];
      const UNIT_WORDS = [
        "","ONE","TWO","THREE","FOUR","FIVE",
        "SIX","SEVEN","EIGHT","NINE","TEN",
        "ELEVEN","TWELVE"
      ];
      const TEEN_STEMS = {
        13:"THIR", 14:"FOUR", 15:"FIF", 16:"SIX",
        17:"SEVEN", 18:"EIGH", 19:"NINE"
      };

      const ROW1 = ["seconds","it","is","special","tens","units","teen"];
      const ROW2 = ["min_word","relation","hour","oclock"];
      const ORDER = ROW1.concat(ROW2);

      const current = {};
      const busy = {};
      let demo = false;
      let demoDate = null;
      let timer = null;

      function hourWord(h) { return HOUR_WORDS[((h % 12) + 12) % 12]; }

      function setMinuteWords(state, n) {
        if (n === 15) { state.special = "QUARTER"; return; }
        if (n === 1) {
          state.units = "ONE";
          state.min_word = "MINUTE";
        } else if (n <= 12) {
          state.units = UNIT_WORDS[n];
          state.min_word = "MINUTES";
        } else if (n <= 19) {
          state.units = TEEN_STEMS[n];
          state.teen = "TEEN";
          state.min_word = "MINUTES";
        } else if (n === 20) {
          state.tens = "TWENTY";
          state.min_word = "MINUTES";
        } else {
          state.tens = "TWENTY";
          state.units = UNIT_WORDS[n - 20];
          state.min_word = "MINUTES";
        }
      }

      function resolveTime(dt) {
        const h = dt.getHours();
        const m = dt.getMinutes();
        const s = dt.getSeconds();
        const state = {
          seconds: (s % 2 === 0) ? "TICK" : "TOCK",
          it: "IT",
          is: "IS",
          special: "",
          tens: "",
          units: "",
          teen: "",
          min_word: "",
          relation: "",
          hour: "",
          oclock: ""
        };
        if (m === 0) {
          state.hour = hourWord(h);
          state.oclock = "O'CLOCK";
        } else if (m === 30) {
          state.special = "HALF";
          state.relation = "PAST";
          state.hour = hourWord(h);
        } else if (m < 30) {
          setMinuteWords(state, m);
          state.relation = "PAST";
          state.hour = hourWord(h);
        } else {
          setMinuteWords(state, 60 - m);
          state.relation = "TO";
          state.hour = hourWord(h + 1);
        }
        return state;
      }

      function sentenceOf(state) {
        const parts = [state.seconds, state.it, state.is, state.special, state.tens];
        if (state.units && state.teen) parts.push(state.units + state.teen);
        else {
          if (state.units) parts.push(state.units);
          if (state.teen) parts.push(state.teen);
        }
        parts.push(state.min_word, state.relation, state.hour, state.oclock);
        return parts.filter(Boolean).join(" ");
      }

      function makeMod(key) {
        const mod = document.createElement("div");
        mod.className = "mod blank";
        mod.dataset.key = key;
        mod.innerHTML =
          '<div class="card">' +
            '<div class="half top static-top"><span></span></div>' +
            '<div class="half bot static-bot"><span></span></div>' +
            '<div class="anim top"><span></span></div>' +
            '<div class="anim bot"><span></span></div>' +
            '<div class="hinge"></div>' +
          '</div>';
        current[key] = "";
        busy[key] = false;
        return mod;
      }

      function setStatic(mod, word) {
        mod.querySelector(".static-top span").textContent = word;
        mod.querySelector(".static-bot span").textContent = word;
        mod.classList.toggle("blank", !word);
      }

      function flip(key, next, delay) {
        const mod = document.querySelector('.mod[data-key="' + key + '"]');
        const prev = current[key];
        if (prev === next) return;
        if (busy[key]) {
          // finish instantly if a second change arrives mid-flip
          mod.classList.remove("go");
          setStatic(mod, next);
          current[key] = next;
          busy[key] = false;
          return;
        }

        const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        if (reduce || prev === undefined) {
          setStatic(mod, next);
          current[key] = next;
          return;
        }

        busy[key] = true;
        window.setTimeout(function () {
          try {
            if (!prev && next) mod.classList.remove("blank");
            mod.querySelector(".anim.top span").textContent = prev;
            mod.querySelector(".anim.bot span").textContent = next;
            // new word's top is revealed as old top folds away
            mod.querySelector(".static-top span").textContent = next;
            mod.querySelector(".static-bot span").textContent = prev;
            mod.classList.toggle("blank", !next && !prev);
            mod.classList.remove("go");
            void mod.offsetWidth;
            mod.classList.add("go");

            const done = function () {
              mod.classList.remove("go");
              setStatic(mod, next);
              current[key] = next;
              busy[key] = false;
              mod.removeEventListener("animationend", onEnd);
            };
            const onEnd = function (ev) {
              if (ev.target.classList.contains("bot")) done();
            };
            mod.addEventListener("animationend", onEnd);
            window.setTimeout(done, 720);
          } catch (err) {
            console.error(err);
            setStatic(mod, next);
            current[key] = next;
            busy[key] = false;
          }
        }, delay || 0);
      }

      function apply(state, stagger, instant) {
        ORDER.forEach(function (key, i) {
          const word = state[key] || "";
          if (word === current[key]) return;
          if (instant) {
            const mod = document.querySelector('.mod[data-key="' + key + '"]');
            setStatic(mod, word);
            current[key] = word;
          } else {
            flip(key, word, stagger ? i * 55 : 0);
          }
        });
        const el = document.getElementById("sentence");
        el.innerHTML = sentenceOf(state).replace(/^(\w+)/, "<strong>$1</strong>");
      }

      function now() {
        if (demo && demoDate) return new Date(demoDate.getTime());
        return new Date();
      }

      function tick() {
        try {
          if (demo && demoDate) {
            // one minute per tick so every roll gets a turn
            demoDate = new Date(demoDate.getTime() + 60000);
            demoDate.setSeconds(demoDate.getSeconds() % 2, 0);
          }
          apply(resolveTime(now()), false);
        } catch (err) {
          console.error("tick:", err);
        }
      }

      function mount() {
        const r1 = document.getElementById("row1");
        const r2 = document.getElementById("row2");
        ROW1.forEach(function (k) { r1.appendChild(makeMod(k)); });
        ROW2.forEach(function (k) { r2.appendChild(makeMod(k)); });
        apply(resolveTime(now()), false, true);
      }

      function setMode(on) {
        demo = on;
        const hint = document.getElementById("modeHint");
        if (demo) {
          demoDate = new Date();
          demoDate.setSeconds(0, 0);
          hint.textContent = "wound · demo hour";
        } else {
          demoDate = null;
          hint.textContent = "live · click strap to wind";
        }
      }

      document.getElementById("strap").addEventListener("click", function () {
        setMode(!demo);
        apply(resolveTime(now()), true);
      });

      window.addEventListener("unhandledrejection", function (e) {
        console.error(e.reason);
      });

      mount();
      timer = window.setInterval(tick, 1000);
    })();
  </script>
</body>
</html>
